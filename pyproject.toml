[project]
name = "cityfeed"
version = "0.1.0"
description = "Multi-city public event ingestion: tiered extraction, entity resolution, measurement"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "cssselect>=1.2",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "icalendar>=6.0",
    "feedparser>=6.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
cityfeed = "cityfeed.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cityfeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
